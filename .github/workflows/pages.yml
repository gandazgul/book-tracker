name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Install locked dependencies
        run: deno install --frozen --allow-scripts=npm:esbuild,npm:sharp
      - run: deno task test
      - name: Build static site
        run: deno task build
        env:
          SITE_URL: https://books.dumbhome.uk
          BASE_PATH: /
          PUBLIC_SHEET_ID: ${{ vars.PUBLIC_SHEET_ID }}
          PUBLIC_SHEET_GID: ${{ vars.PUBLIC_SHEET_GID }}
          PUBLIC_TBR_GID: ${{ vars.PUBLIC_TBR_GID }}
          PUBLIC_GOOGLE_BOOKS_API_KEY: ${{ vars.PUBLIC_GOOGLE_BOOKS_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
